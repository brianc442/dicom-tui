[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dicom-metadata-extractor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.50.0",
  "pydicom>=2.4.0",
  "tomli-w>=1.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
dicom-tui = "src.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "textual[dev]>=0.50.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
