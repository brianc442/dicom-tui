[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dicom-tui"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "textual>=0.50.0",
  "pydicom>=2.4.0",
  "tomli-w>=1.0.0",
]

[project.scripts]
dicom-tui = "src.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "textual[dev]>=0.50.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
